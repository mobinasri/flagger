# Reusable workflow: builds one image natively for linux/amd64 and linux/arm64
# and, if push is true, merges both into a single multi-arch tag on Docker Hub.
# Called by docker-images.yml.
#
# Images built on another image of this repo (e.g. FROM ${BIO_BASE}) name that build arg in base-arg.
# If the base image was built earlier in the same run with export-artifact, base-artifact names it and
# the build uses that image instead of the one on Docker Hub.
name: docker-build

on:
  workflow_call:
    inputs:
      image:
        description: "Image name without tag, e.g. mobinasri/bio_base"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: true
        type: string
      version:
        description: "Version tag, e.g. v1.2.1 (required when push is true)"
        required: false
        type: string
        default: ""
      push:
        description: "Push the image to Docker Hub"
        required: false
        type: boolean
        default: false
      latest:
        description: "Also tag the pushed image as latest"
        required: false
        type: boolean
        default: false
      build-args:
        description: "Newline-separated build args"
        required: false
        type: string
        default: ""
      smoke-test:
        description: "Shell command run inside the built image to check it works"
        required: false
        type: string
        default: ""
      export-artifact:
        description: "Also save the image as an artifact so later jobs in this run can build on it"
        required: false
        type: boolean
        default: false
      base-arg:
        description: "Build arg holding the base image, e.g. BIO_BASE"
        required: false
        type: string
        default: ""
      base-artifact:
        description: "Image key of a base image exported earlier in this run, e.g. mobinasri-bio_base"
        required: false
        type: string
        default: ""
      base-image:
        description: "Base image to use when base-artifact is empty. Empty = the Dockerfile default"
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: false

env:
  DOCKERHUB_USERNAME: mobinasri

jobs:
  build:
    name: ${{ inputs.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Check version is set when pushing
        if: inputs.push && inputs.version == ''
        run: |
          echo "::error::version must be set when push is true"
          exit 1

      # e.g. mobinasri/bio_base -> mobinasri-bio_base, used in cache scopes and artifact names
      - name: Make image key
        id: key
        env:
          IMAGE: ${{ inputs.image }}
        run: echo "key=${IMAGE//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download base image
        if: inputs.base-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.base-artifact }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/base-image

      # Points base-arg at the base image built in this run, or checks that the
      # Docker Hub base image exists for this architecture
      - name: Prepare build
        id: prep
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          BASE_ARG: ${{ inputs.base-arg }}
          BASE_ARTIFACT: ${{ inputs.base-artifact }}
          BASE_IMAGE: ${{ inputs.base-image }}
          CONTEXT: ${{ inputs.context }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          args="${BUILD_ARGS}"
          contexts=""
          if [ -n "${BASE_ARG}" ] && [ -n "${BASE_ARTIFACT}" ]; then
            digest=$(jq -r '.manifests[0].digest' "${RUNNER_TEMP}/base-image/index.json")
            args+=$'\n'"${BASE_ARG}=ci-base"
            contexts="ci-base=oci-layout://${RUNNER_TEMP}/base-image@${digest}"
            echo "Using ${BASE_ARTIFACT} built in this run (${digest})"
          elif [ -n "${BASE_ARG}" ]; then
            if [ -n "${BASE_IMAGE}" ]; then
              args+=$'\n'"${BASE_ARG}=${BASE_IMAGE}"
              ref="${BASE_IMAGE}"
            else
              ref=$(sed -n "s/^ARG ${BASE_ARG}=//p" "${CONTEXT}/Dockerfile" | head -1)
            fi
            platforms=$(docker buildx imagetools inspect --format '{{json .Image}}' "${ref}" |
              jq -r 'if has("architecture") then "\(.os)/\(.architecture)" else keys[] end')
            if ! grep -qE "^linux/${ARCH}(/|$)" <<<"${platforms}"; then
              echo "::error::Base image ${ref} has no linux/${ARCH} variant (it has: ${platforms//$'\n'/ }). Publish it for both architectures first, or change it in the same pull request so it is built in this run."
              exit 1
            fi
            echo "Using ${ref} from Docker Hub"
          fi
          {
            echo "build-args<<EOF"
            echo "${args}"
            echo "EOF"
            echo "build-contexts=${contexts}"
          } >> "$GITHUB_OUTPUT"

      # When pushing, push by digest only; the merge job adds the tags.
      # Otherwise load the image into the local docker daemon for the smoke test.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.prep.outputs.build-args }}
          build-contexts: ${{ steps.prep.outputs.build-contexts }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || format('type=docker,name={0}:ci', inputs.image) }}
          cache-from: type=gha,scope=${{ steps.key.outputs.key }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.key.outputs.key }}-${{ matrix.arch }}

      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          IMAGE_REF: ${{ inputs.push && format('{0}@{1}', inputs.image, steps.build.outputs.digest) || format('{0}:ci', inputs.image) }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: docker run --rm "$IMAGE_REF" bash -euo pipefail -c "$SMOKE_TEST"

      # Rebuilds from the builder's cache (no layers are rebuilt) and writes the
      # image as an OCI layout that downstream jobs pass to --build-context
      - name: Export image for downstream builds
        if: inputs.export-artifact
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.prep.outputs.build-args }}
          build-contexts: ${{ steps.prep.outputs.build-contexts }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false

      - name: Upload image
        if: inputs.export-artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ steps.key.outputs.key }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.key.outputs.key }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch ${{ inputs.image }}
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Make image key
        id: key
        env:
          IMAGE: ${{ inputs.image }}
        run: echo "key=${IMAGE//\//-}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ steps.key.outputs.key }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same tags as the Makefiles: <version>, <version>--<commit> and optionally latest
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION}--${GITHUB_SHA}")
          if [ "${LATEST}" = "true" ]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ inputs.image }}:${{ inputs.version }}"
