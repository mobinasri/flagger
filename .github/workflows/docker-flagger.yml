# Builds the main mobinasri/flagger image (root Dockerfile) for linux/amd64 and linux/arm64.
# - Pull requests that touch the image only build and smoke-test it.
# - Pushing a version tag (e.g. v1.2.1) publishes flagger:<tag>, flagger:<tag>--<commit> and flagger:latest.
# - It can also be run by hand from the Actions tab.
# The image is built on mobinasri/bio_base, which must already be published for both architectures
# (see docker-base-images.yml).
name: docker-flagger

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "programs/**"
      - "scripts/**"
      - "ext/secphase/programs/submodules/cigar_it/**"
      - ".github/workflows/docker-flagger.yml"
      - ".github/workflows/docker-build.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to push, e.g. v1.2.1 (required if push is checked)"
        type: string
        default: ""
      push:
        description: "Push the image to Docker Hub"
        type: boolean
        default: false
      latest:
        description: "Also tag the pushed image as latest"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flagger:
    uses: ./.github/workflows/docker-build.yml
    with:
      image: mobinasri/flagger
      context: .
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      push: ${{ github.event_name == 'push' || inputs.push == true }}
      latest: ${{ github.event_name == 'push' || inputs.latest == true }}
      smoke-test: |
        for p in hmm_flagger bam2cov cov2counts cov2wig coverage_format_converter depth2cov \
                 filter_alt_reads find_blocks_from_table make_summary_table split_cov_by_contig; do
          command -v "$p"
        done
        samtools --version | head -1
        whatshap --version
        python3 -c "import scipy, pandas, matplotlib, smt"
        java -version
        printf 'chr1\t1000\n' > /tmp/chrom.sizes
        printf 'chr1\t0\t100\t1.5\n' > /tmp/test.bedgraph
        bedGraphToBigWig /tmp/test.bedgraph /tmp/chrom.sizes /tmp/test.bigwig
        test -s /tmp/test.bigwig
    secrets: inherit
